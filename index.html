<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Fitness App</title>
<meta name="description" content="צ׳קליסט אימונים לפי לוח שבועי, עם משקלים, הליכון והיסטוריה. הנתונים נשמרים במכשיר.">
<meta name="theme-color" content="#141719">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Fitness App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Heebo';font-style:normal;font-display:swap;font-weight:100 900;src:url(heebo-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-style:normal;font-display:swap;font-weight:100 900;src:url(heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Layout: one phone-width column. An ink calendar band (week label, date range, seven day cells) sits above the selected day's checklist on warm paper; machine rows are tickable cards carrying the gym's red machine-number plate; a fixed four-tab bar runs along the bottom, and an ink strip sits behind the phone's status bar. */
:root{
  --paper:#EDE9E3;
  --card:#FFFFFF;
  --ink:#141719;
  --dim:#66615B;
  --line:#CFC8BE;
  --field:#F6F3EF;
  --head:#141719;
  --head-fg:#EDE9E3;
  --head-dim:#ABA69E;
  --head-line:#363C40;
  --done:#2E5D4B;
  --done-wash:#E2EAE4;
  --on-done:#FFFFFF;
  --mark:#C3352B;
  --on-mark:#FFFFFF;
  --ok:#4F9B79;
  --wait:#C98A2E;
  --bad:#D2493E;
  --font:'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111416; --card:#1A1E21; --ink:#ECE7E0; --dim:#A19B92; --line:#31373B; --field:#15191C;
    --head:#20262A; --head-fg:#ECE7E0; --head-dim:#A39D94; --head-line:#3A4247;
    --done:#5FA886; --done-wash:#17261F; --on-done:#0C1712;
    --mark:#C9443A; --on-mark:#FFFFFF;
    --ok:#6CC097; --wait:#E0A44A; --bad:#EF6A5E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111416; --card:#1A1E21; --ink:#ECE7E0; --dim:#A19B92; --line:#31373B; --field:#15191C;
  --head:#20262A; --head-fg:#ECE7E0; --head-dim:#A39D94; --head-line:#3A4247;
  --done:#5FA886; --done-wash:#17261F; --on-done:#0C1712;
  --mark:#C9443A; --on-mark:#FFFFFF;
  --ok:#6CC097; --wait:#E0A44A; --bad:#EF6A5E;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
input,.dn,.count,.num,.wval,.rin,.hd{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--done);outline-offset:1px}

.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--head);z-index:25}
#app{max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#view{display:grid;gap:14px;outline:none}

/* week band */
.wk{background:var(--head);color:var(--head-fg);border-radius:18px;padding:14px 10px 10px;display:grid;gap:12px}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:8px}
.wk-titles{min-width:0}
.wk-label{font-size:1.15rem;font-weight:800;line-height:1.25}
.wk-range{font-size:.88rem;color:var(--head-dim)}
.wk-nav{display:flex;align-items:center;gap:6px;flex:none}
.wk-btn{min-width:42px;height:42px;border-radius:12px;border:1px solid var(--head-line);background:transparent;color:var(--head-fg);display:inline-grid;place-items:center;cursor:pointer;padding:0 10px;font-size:.9rem;font-weight:500}
.wk-btn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dcell{display:grid;justify-items:center;gap:3px;padding:8px 0 9px;border-radius:12px;border:0;background:transparent;color:var(--head-fg);cursor:pointer}
.dl{font-size:.78rem;color:var(--head-dim);font-weight:500}
.dn{font-size:1.15rem;font-weight:700;line-height:1.2}
.dcell.today .dn{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:5px}
.dm{width:9px;height:9px;border-radius:50%;margin-top:2px}
.dcell[aria-selected="true"]{background:var(--head-fg);color:var(--head)}
.dcell[aria-selected="true"] .dl{color:var(--head)}
.st-full .dm{background:var(--ok)}
.st-part .dm{box-shadow:inset 0 0 0 2px var(--ok)}
.st-planned .dm{background:currentColor;transform:scale(.7)}
.st-missed .dm{box-shadow:inset 0 0 0 1.5px var(--head-dim)}
.dcell[aria-selected="true"].st-missed .dm{box-shadow:inset 0 0 0 1.5px var(--head)}

/* day panel */
.day{display:grid;gap:12px}
.dtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-inline:4px}
.dtitle h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rel{font-size:.8rem;font-weight:700;border-radius:99px;padding:1px 10px;background:var(--mark);color:var(--on-mark)}
.rel.soft{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.dsub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim);padding-inline:4px;margin-top:-8px}
.prog{display:grid;gap:6px;padding-inline:4px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.count{font-size:.95rem;font-weight:500}
.count.complete{color:var(--done);font-weight:700}

.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--dim);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wait)}
.status.st-ok::before{background:var(--ok)}
.status.st-err::before{background:var(--bad)}

.sess{display:grid;gap:8px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;padding-inline:4px;margin-top:6px}
.shead h2{font-size:1.2rem;font-weight:800}
.smeta{font-size:.85rem;color:var(--dim)}
.list{display:grid;gap:8px}
.group{font-size:.82rem;font-weight:700;color:var(--dim);padding-inline:4px;margin-top:6px}
.list>.group:first-child{margin-top:0}

.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.row.done{background:var(--done-wash);border-color:var(--done)}
.row.skipped{background:transparent;border-style:dashed}
.row.preview{padding:10px 12px}
.tick{flex:none;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--field);display:grid;place-items:center;color:var(--on-done);cursor:pointer;padding:0}
.tick svg{width:24px;height:24px;opacity:0;transition:opacity .15s}
.row.done .tick{background:var(--done);border-color:var(--done)}
.row.done .tick svg{opacity:1}
.state{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.state svg{width:18px;height:18px}
.state.yes{background:var(--done);color:var(--on-done)}
.state.no{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--dim)}
.body{flex:1;min-width:0;display:grid;gap:3px}
.name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:1.05rem;font-weight:700;line-height:1.3}
.row.done.live .nm{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.num{display:inline-block;background:var(--mark);color:var(--on-mark);font-size:.75rem;font-weight:700;line-height:1.55;border-radius:5px;padding:0 7px}
.num.nomach{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.meta{font-size:.9rem;color:var(--dim)}
.desc{font-size:.84rem;color:var(--dim)}
.skip{font-size:.8rem;color:var(--dim);font-weight:700}
.res{font-size:.9rem;font-weight:500}

.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.wlab,.unit{font-size:.85rem;color:var(--dim)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.step{width:46px;min-height:42px;border:0;background:transparent;font-size:1.35rem;line-height:1;cursor:pointer;color:var(--ink);padding:0}
.step:active{background:var(--line)}
.wval{width:70px;border:0;border-inline:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-size:17px;font-weight:700;padding:0 4px;border-radius:0;min-width:0}

.results{margin-top:8px;display:grid;gap:6px}
.rhead{font-size:.85rem;font-weight:700;color:var(--dim)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rf{display:grid;gap:3px;min-width:0}
.rl{font-size:.8rem;color:var(--dim)}
.rin{width:100%;min-width:0;font-size:16px;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 6px;min-height:42px;text-align:center}
.time{display:flex;align-items:center;gap:4px}
.time .rin{flex:1}
.colon{font-weight:700}

.notecard{display:grid;gap:6px}
.nlabel{font-size:.85rem;font-weight:700;color:var(--dim);padding-inline:4px}
.ntext{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap}
textarea,.field input{width:100%;min-width:0;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
textarea{resize:vertical;line-height:1.5;background:var(--card)}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.85rem;color:var(--dim);font-weight:500}
.selwrap{position:relative;display:block;min-width:0}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:16px;padding-block:8px;padding-inline:12px 40px;cursor:pointer}
.selarrow{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim);display:grid}
.selarrow svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;font-weight:500;cursor:pointer;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:var(--mark);border-color:var(--mark);background:transparent}
.btn.danger-solid{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.small{min-height:38px;padding:4px 12px;font-size:.9rem;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;padding:0;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.3;cursor:default}
.factions,.dact{display:flex;flex-wrap:wrap;gap:8px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;justify-items:start}
.empty>p{max-width:60ch}
.empty .selwrap{justify-self:stretch}
.empty-t{font-weight:800;font-size:1.1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.panel h3{font-size:1rem;font-weight:800}
.dedit{display:grid;gap:10px}
.dedit>.btn{justify-self:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.tchip{display:inline-flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:99px;padding-block:2px;padding-inline:12px 3px;font-weight:500;max-width:100%}
.tchip button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim);padding:0;flex:none}
.tchip button svg{width:16px;height:16px}
.rest{color:var(--dim)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days7 button{display:grid;justify-items:center;min-height:50px;padding:4px 0;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;color:var(--ink)}
.days7 .m-l{font-size:.75rem;color:var(--dim)}
.days7 .m-n{font-weight:700}
.days7 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.days7 button[aria-pressed="true"] .m-l{color:var(--paper)}
.days7 button:disabled{opacity:.3;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--field);gap:3px;justify-self:start}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button:disabled{opacity:.4;cursor:default}
.hint{font-size:.85rem;color:var(--dim)}
.note{color:var(--dim);font-size:.92rem;padding-inline:4px;max-width:62ch}
.err{color:var(--mark);font-weight:500;font-size:.9rem}
.confirm{border:1.5px solid var(--mark);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--card)}

/* notices */
.upd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px 10px 14px;font-weight:500}
.upd .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.remind{background:var(--card);border:1.5px solid var(--wait);border-radius:14px;padding:14px;display:grid;gap:8px;justify-items:start}
.remind>p{max-width:60ch}
.install{background:var(--card);border:1.5px solid var(--mark);border-radius:14px;padding:14px;display:grid;gap:6px}
.install>p{max-width:60ch}
.warn{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rpanel{display:grid;gap:10px;justify-self:stretch;width:100%}

/* views */
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:4px;margin-top:4px}
.vhead h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;min-width:0}
.lede{color:var(--dim);padding-inline:4px;max-width:62ch}
.sec{display:grid;gap:10px;margin-top:6px}
.sec>h2,.h2{font-size:1.15rem;font-weight:800;padding-inline:4px}
.plist,.tlist,.sched,.hlist{display:grid;gap:8px}
.prow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pmain{flex:1 1 190px;min-width:0;display:grid;gap:3px}
.pact{display:flex;gap:6px;align-items:center;flex:none}
.tcard,.hitem{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;cursor:pointer;color:var(--ink)}
.tmain,.hmain{display:grid;gap:3px;min-width:0}
.tname{font-size:1.1rem;font-weight:800}
.tsum{font-size:.9rem;color:var(--dim)}
.chev{color:var(--dim);display:grid}
.chev svg{width:20px;height:20px}
.pform{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-size:.9rem;font-weight:800;padding:0 6px}
.fieldrow{display:grid;gap:4px}
.flabel{font-size:.85rem;color:var(--dim);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--dim);font-weight:500;padding:6px 2px;min-height:40px;cursor:pointer;justify-self:start}
.back svg{width:18px;height:18px}

.srow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 12px;align-items:center}
.srow.today{border-color:var(--ink)}
.sday{font-weight:800;display:grid;gap:2px;align-self:start;padding-top:6px}
.stoday{font-size:.75rem;font-weight:700;color:var(--mark)}
.srow>.chips,.srow>.selwrap{grid-column:2}

.month{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:1.1rem;font-weight:800;padding-inline:4px;margin-top:8px}
.mcount{font-size:.85rem;font-weight:500;color:var(--dim)}
.hdate{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.hday{font-weight:800;font-size:1.05rem}
.hd{color:var(--dim);font-size:.9rem}
.hsum{font-size:.9rem}
.hnote{font-size:.85rem;color:var(--dim)}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-block:2px}
.dots i{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--line)}
.dots i.on{background:var(--done);box-shadow:none}

.welcome{display:grid;gap:14px;padding-block:12px}
.wtitle{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;padding-inline:4px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;justify-items:start}

/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;min-height:58px;border:0;background:none;color:var(--dim);font-size:.78rem;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{color:var(--mark)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){

<script>
(function(){
'use strict';
/* ==========================================================================
 * My Fitness App: a standalone web app. No account and no server: everything is
 * saved in the browser storage of the device, and backups are JSON files.
 *
 * Storage (localStorage, one key per document)
 *   mfa:app                    PlanDoc
 *   mfa:w:<YYYY-MM-DD>         DayRecord (one per date)
 *   mfa:meta                   {lastBackupAt}
 * Backup file = {app:'my-fitness-app', format:2, exportedAt, plan:PlanDoc, workouts:[DayRecord]}
 *
 * PlanDoc   = {schema:2, catalog:[Item], types:[Type], schedule:[Version],
 *              overrides:{date:[typeId]}, createdAt, updatedAt}
 * Item      = strength {id, kind:'strength', name, machine, group, desc, sets, reps, weight,
 *                       equip:'machine'|'body', unit:'reps'|'sec', perSide}
 *             (equip, unit and perSide are optional; missing means machine, reps, false)
 *           | cardio   {id, kind:'cardio', name, mode:'walk'|'walkrun', minutes,
 *                       walk:{speed,incline}, run:{speed,incline,minutes,every},
 *                       cooldown:{minutes,speed,incline}, notes}
 *             Weight lives on the item, so it is shared by every type that uses it.
 * Type      = {id, name, items:[itemId]}             (ordered)
 * Version   = {from:'YYYY-MM-DD', days:[[typeId] x7]} (index 0 = Sunday); the
 *             weekly schedule in force on a date is the latest version with
 *             from <= date. Permanent changes add a version from today.
 * overrides = one-time changes: the exact list of type ids for that date.
 * DayRecord = {schema:2, date, createdAt, updatedAt, note,
 *              sessions:[{typeId, name, items:[RecItem]}]}
 * RecItem   = strength {id, kind, name, machine, group, sets, reps, weight, equip, unit, perSide, done}
 *           | cardio   {id, kind, name, mode, minutes, walk, run, cooldown, notes,
 *                       done, result:{min,sec,km,hr,kcal}}
 * Today's record follows the plan live (rebuilt on every write); records of
 * other dates are frozen snapshots and change only when edited directly.
 * ========================================================================== */

const D = document;
const P = 'mfa:';
const GROUPS = ['חימום','חזה','גב','כתפיים','רגליים','ידיים','בטן','גו','אחר'];
const CARDIO_GROUP = 'אירובי';
const isBody = c => !!c && c.equip === 'body';
const strengthExtra = c => ({equip:isBody(c) ? 'body' : 'machine', unit:c && c.unit === 'sec' ? 'sec' : 'reps', perSide:!!(c && c.perSide)});
const WD_LETTER = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const WD_NAME = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const fDay = new Intl.DateTimeFormat('he-IL', {weekday:'long'});
const fDate = new Intl.DateTimeFormat('he-IL', {day:'numeric', month:'long', year:'numeric'});
const fDM = new Intl.DateTimeFormat('he-IL', {day:'numeric', month:'long'});
const fMonth = new Intl.DateTimeFormat('he-IL', {month:'long', year:'numeric'});

/* Starter plan offered to new users (machine list without weights). */
const SAMPLE_CATALOG = [
  {id:'m2',  kind:'strength', name:'לחיצת חזה במכשיר', machine:'2', group:'חזה', desc:'לחיצה מתכנסת, תוצרת Precor', sets:3, reps:12},
  {id:'m8a', kind:'strength', name:'חתירה בישיבה באחיזה צרה', machine:'8', group:'גב', desc:'פרפר ופרפר הפוך, תוצרת Precor', sets:2, reps:15},
  {id:'m8b', kind:'strength', name:'הרחקה אופקית במכונה', machine:'8', group:'גב', desc:'פרפר ופרפר הפוך, תוצרת Precor', sets:2, reps:15},
  {id:'m1',  kind:'strength', name:'לחיצת כתפיים בישיבה', machine:'1', group:'כתפיים', desc:'לחיצת כתפיים, תוצרת Precor', sets:3, reps:10},
  {id:'m13', kind:'strength', name:'הרחקת כתפיים', machine:'13', group:'כתפיים', desc:'הרחקה לצדדים, תוצרת Spirit', sets:2, reps:10},
  {id:'m19', kind:'strength', name:'פשיטת ברך', machine:'19', group:'רגליים', desc:'מכשיר בישיבה', sets:2, reps:12},
  {id:'m18', kind:'strength', name:'כפיפת ברך בשכיבה', machine:'18', group:'רגליים', desc:'תוצרת Precor', sets:2, reps:12},
  {id:'m17', kind:'strength', name:'לחיצת רגליים', machine:'17', group:'רגליים', desc:'תוצרת Precor', sets:2, reps:12},
  {id:'m14', kind:'strength', name:'כפיפת מרפקים', machine:'14', group:'ידיים', desc:'משקולות מובנות, ריפוד אדום', sets:3, reps:12},
  {id:'mdip',kind:'strength', name:'פשיטת מרפקים במכשיר מקבילים', machine:'', group:'ידיים', desc:'מכשיר מקבילים של Nautilus, בלי מספר', sets:3, reps:12},
  {id:'m12', kind:'strength', name:'כפיפת בטן במכשיר', machine:'12', group:'בטן', desc:'תוצרת Precor', sets:3, reps:12},
  {id:'tm',  kind:'cardio', name:'הליכון', mode:'walk', minutes:20, walk:{speed:null, incline:null}, run:{speed:null, incline:null, minutes:null, every:null}, cooldown:{minutes:null, speed:null, incline:null}, notes:'הליכה מהירה בשיפוע נמוך'}
];

const SVG = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
  dash:SVG('<path d="M7 12h10"/>'),
  right:SVG('<path d="M9 6l6 6-6 6"/>'),
  left:SVG('<path d="M15 6l-6 6 6 6"/>'),
  up:SVG('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  down:SVG('<path d="M12 5v14M6 13l6 6 6-6"/>'),
  x:SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
  plus:SVG('<path d="M12 5v14M5 12h14"/>'),
  caret:SVG('<path d="M6 9l6 6 6-6"/>')
};

/* ---------- small utilities ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
const keyDate = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = keyDate(k); d.setDate(d.getDate() + n); return keyOf(d); };
const weekdayOf = k => keyDate(k).getDay();
const weekStart = k => addDays(k, -weekdayOf(k));
const dayDiff = (a, b) => Math.round((keyDate(b) - keyDate(a)) / 864e5);
const isKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
const nowISO = () => new Date().toISOString();
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const uniq = a => a.filter((x, i) => a.indexOf(x) === i);
const emptyWeek = () => [[], [], [], [], [], [], []];
const newId = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
function stable(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
const same = (a, b) => stable(a) === stable(b);
function num(v){
  if (v === '' || v == null) return null;
  const n = typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}
const round2 = n => Math.round(n * 100) / 100;
const fmtNum = v => { const n = num(v); return n == null ? '' : String(round2(n)); };
const posInt = v => { const n = num(v); return n == null || n <= 0 ? null : Math.round(n); };
const nonNeg = v => { const n = num(v); return n == null || n < 0 ? null : round2(n); };
const excerpt = (s, n) => s.length > n ? s.slice(0, n).trim() + '…' : s;
function minutesPhrase(m){ const n = num(m); return n === 1 ? 'דקה' : n === 2 ? 'שתי דקות' : fmtNum(n) + ' דקות'; }
function setsText(sets, reps, unit, perSide){
  const s = num(sets), r = num(reps);
  let a = s ? (s === 1 ? 'סט אחד' : s + ' סטים') : '';
  if (r) a += (a ? ' של ' : '') + (unit === 'sec' ? (r === 1 ? 'שנייה אחת' : r + ' שניות') : (r === 1 ? 'חזרה אחת' : r + ' חזרות'));
  if (a && perSide) a += ' לכל צד';
  return a;
}
function itemsSummary(sn, cn){
  const a = [];
  if (sn) a.push(sn === 1 ? 'תרגיל אחד' : sn + ' תרגילים');
  if (cn) a.push(cn === 1 ? 'פעילות אירובית' : cn + ' פעילויות אירוביות');
  return a.join(' ו');
}
function speedIncline(sp, inc){
  const a = [];
  if (num(sp) != null) a.push('במהירות ' + fmtNum(sp) + ' קמ״ש');
  if (num(inc) != null) a.push('שיפוע ' + fmtNum(inc));
  return a.join(', ');
}
function cardioLines(c){
  const L = [], w = c.walk || {}, r = c.run || {}, cd = c.cooldown || {};
  const walk = speedIncline(w.speed, w.incline);
  if (walk || c.mode === 'walkrun') L.push('הליכה' + (walk ? ' ' + walk : ''));
  if (c.mode === 'walkrun') {
    let run = 'ריצה';
    if (num(r.minutes) != null) run += ' של ' + minutesPhrase(r.minutes);
    if (num(r.every) != null) run += ' כל ' + minutesPhrase(r.every);
    const rs = speedIncline(r.speed, r.incline);
    if (rs) run += ', ' + rs;
    L.push(run);
  }
  if (num(c.minutes) != null) L.push('משך כולל ' + minutesPhrase(c.minutes));
  if (num(cd.minutes) != null) { const s = speedIncline(cd.speed, cd.incline); L.push('התקררות ' + minutesPhrase(cd.minutes) + (s ? ' ' + s : '')); }
  if (c.notes) L.push(c.notes);
  return L;
}
const emptyResult = () => ({min:null, sec:null, km:null, hr:null, kcal:null});
const hasResult = r => !!r && ['min','sec','km','hr','kcal'].some(k => r[k] != null && r[k] !== '');
function timeStr(r){
  const m = num(r.min), s = num(r.sec);
  if (m == null && s == null) return '';
  const mm = Math.floor(m || 0), ss = Math.round(s || 0);
  return mm >= 60 ? Math.floor(mm / 60) + ':' + pad(mm % 60) + ':' + pad(ss) : mm + ':' + pad(ss);
}
function resultText(r){
  if (!r) return '';
  const a = [], t = timeStr(r);
  if (t) a.push('זמן ' + t);
  if (num(r.km) != null) a.push(fmtNum(r.km) + ' ק״מ');
  if (num(r.hr) != null) a.push('דופק ממוצע ' + fmtNum(r.hr));
  if (num(r.kcal) != null) a.push(fmtNum(r.kcal) + ' קלוריות');
  return a.join(', ');
}
function isStandalone(){ try { return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } }
function isIOS(){ const ua = navigator.userAgent || ''; return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isMobileOS(){ return isIOS() || /Android/i.test(navigator.userAgent || ''); }

/* ---------- element builder ---------- */
function h(tag, attrs){
  const el = D.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (let i = 2; i < arguments.length; i++) {
    const kid = arguments[i];
    if (kid == null || kid === false) continue;
    if (Array.isArray(kid)) kid.forEach(x => { if (x != null && x !== false) el.append(x.nodeType ? x : D.createTextNode(String(x))); });
    else el.append(kid.nodeType ? kid : D.createTextNode(String(kid)));
  }
  return el;
}
const enterBlur = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
const focusSoon = id => setTimeout(() => { const el = D.getElementById(id); if (el) try { el.focus(); } catch (e) {} }, 40);

/* ---------- device storage ---------- */
const store = {
  get(k){ try { const v = localStorage.getItem(P + k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k){ try { localStorage.removeItem(P + k); return true; } catch (e) { return false; } },
  keys(){ const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(P) === 0) out.push(k.slice(P.length)); } } catch (e) {} return out; }
};
function storageWorks(){ try { localStorage.setItem(P + 'probe', '1'); localStorage.removeItem(P + 'probe'); return true; } catch (e) { return false; } }

/* ---------- state ---------- */
const S = {
  ready:false, app:null, workouts:{}, meta:{},
  tab:'week', sel:todayKey(), lastToday:todayKey(),
  dayEdit:null, moveTarget:null, moveKind:'once', pastEdit:null, virtual:null,
  sub:null, draft:null, draftError:null, confirm:null,
  restoreOpen:false, restoreText:'', restoreError:null, restorePending:null, backupText:'',
  status:'local', storageOK:true, warned:false, updateReady:false
};

const cat = () => (S.app && S.app.catalog) || [];
const types = () => (S.app && S.app.types) || [];
const catById = id => cat().find(c => c.id === id) || null;
const typeById = id => types().find(t => t.id === id) || null;

function normApp(a){
  if (!a || typeof a !== 'object') return null;
  const o = clone(a);
  o.schema = 2;
  o.catalog = Array.isArray(o.catalog) ? o.catalog.filter(c => c && typeof c.id === 'string') : [];
  o.catalog.forEach(c => { c.kind = c.kind === 'cardio' ? 'cardio' : 'strength'; c.name = String(c.name || ''); });
  o.types = Array.isArray(o.types) ? o.types.filter(t => t && typeof t.id === 'string') : [];
  o.types.forEach(t => { t.name = String(t.name || ''); t.items = Array.isArray(t.items) ? t.items.filter(x => typeof x === 'string') : []; });
  o.schedule = Array.isArray(o.schedule) ? o.schedule.filter(v => v && isKey(v.from) && Array.isArray(v.days))
    .map(v => ({from:v.from, days:[0,1,2,3,4,5,6].map(i => Array.isArray(v.days[i]) ? v.days[i].filter(x => typeof x === 'string') : [])}))
    .sort((x, y) => x.from < y.from ? -1 : x.from > y.from ? 1 : 0) : [];
  o.overrides = o.overrides && typeof o.overrides === 'object' && !Array.isArray(o.overrides) ? o.overrides : {};
  Object.keys(o.overrides).forEach(k => { if (!isKey(k) || !Array.isArray(o.overrides[k])) delete o.overrides[k]; });
  return o;
}
function normRec(r){
  if (!r || typeof r !== 'object' || !isKey(r.date)) return null;
  const o = clone(r);
  o.sessions = Array.isArray(o.sessions) ? o.sessions.filter(s => s && Array.isArray(s.items)) : [];
  o.note = typeof o.note === 'string' ? o.note : '';
  return o;
}

/* ---------- schedule ---------- */
function versionFor(date, app){
  const a = app || S.app; let v = null;
  ((a && a.schedule) || []).forEach(x => { if (x.from <= date) v = x; });
  return v;
}
function templateFor(date, app){ const v = versionFor(date, app); return v ? (v.days[weekdayOf(date)] || []).slice() : []; }
function hasOverride(date, app){ const a = app || S.app; return !!(a && a.overrides && Object.prototype.hasOwnProperty.call(a.overrides, date)); }
function rawPlanned(date, app){ const a = app || S.app; return hasOverride(date, a) ? a.overrides[date].slice() : templateFor(date, a); }
function plannedTypes(date){ return uniq(rawPlanned(date).filter(id => typeById(id))); }
function scheduleEmpty(){ const v = versionFor(todayKey()); return !v || v.days.every(d => !d.some(id => typeById(id))); }
function scheduledDays(tid){ const v = versionFor(todayKey()); const out = []; if (v) v.days.forEach((d, i) => { if (d.includes(tid)) out.push(i); }); return out; }
function sameSet(a, b){ const x = uniq(a).sort(), y = uniq(b).sort(); return x.length === y.length && x.every((v, i) => v === y[i]); }
function setOverride(app, date, ids){
  app.overrides = app.overrides || {};
  const clean = uniq(ids.filter(id => app.types.some(t => t.id === id)));
  if (sameSet(clean, templateFor(date, app).filter(id => app.types.some(t => t.id === id)))) delete app.overrides[date];
  else app.overrides[date] = clean;
}
function upsertVersion(app, from, days){
  const sch = (app.schedule || []).filter(v => v.from < from).sort((x, y) => x.from < y.from ? -1 : 1);
  const prev = sch[sch.length - 1];
  if (!(prev && same(prev.days, days))) sch.push({from, days});
  app.schedule = sch;
}
function editSchedule(fn){
  const app = clone(S.app), t = todayKey();
  const cur = versionFor(t, app);
  const days = cur ? clone(cur.days) : emptyWeek();
  fn(days);
  for (let i = 0; i < 7; i++) days[i] = uniq((days[i] || []).filter(id => app.types.some(x => x.id === id)));
  upsertVersion(app, t, days);
  savePlan(app);
}
function dayAdd(date, tid){ const app = clone(S.app); setOverride(app, date, rawPlanned(date, app).concat([tid])); savePlan(app); toast('האימון נוסף ליום הזה בלבד'); render(); }
function dayRemove(date, tid){ const app = clone(S.app); setOverride(app, date, rawPlanned(date, app).filter(x => x !== tid)); savePlan(app); render(); }
function dayReset(date){ const app = clone(S.app); if (app.overrides) delete app.overrides[date]; savePlan(app); toast('היום חזר ללוח הקבוע'); render(); }
function moveOnce(src, tgt){
  const app = clone(S.app);
  const moving = rawPlanned(src, app);
  setOverride(app, tgt, rawPlanned(tgt, app).concat(moving));
  setOverride(app, src, []);
  savePlan(app);
}
function movePermanent(src, tgt){
  const app = clone(S.app), t = todayKey();
  const ws = weekdayOf(src), wt = weekdayOf(tgt);
  const cur = versionFor(t, app);
  const days = cur ? clone(cur.days) : emptyWeek();
  days[wt] = uniq(days[wt].concat(days[ws]));
  days[ws] = [];
  upsertVersion(app, t, days);
  if (app.overrides) { delete app.overrides[src]; delete app.overrides[tgt]; }
  savePlan(app);
}

/* ---------- day records ---------- */
function recItemFrom(c){
  if (c.kind === 'cardio') return {id:c.id, kind:'cardio', name:c.name, mode:c.mode === 'walkrun' ? 'walkrun' : 'walk', minutes:num(c.minutes), walk:clone(c.walk || {}), run:clone(c.run || {}), cooldown:clone(c.cooldown || {}), notes:c.notes || '', done:false, result:emptyResult()};
  return Object.assign({id:c.id, kind:'strength', name:c.name, machine:isBody(c) ? '' : (c.machine || ''), group:c.group || '', sets:num(c.sets), reps:num(c.reps), weight:isBody(c) ? null : num(c.weight)}, strengthExtra(c), {done:false});
}
function frozenSession(tid){
  const t = typeById(tid); if (!t) return null;
  return {typeId:tid, name:t.name, items:t.items.map(catById).filter(Boolean).map(recItemFrom)};
}
function virtualFor(date, tids){
  return {schema:2, date, createdAt:nowISO(), updatedAt:nowISO(), sessions:tids.map(frozenSession).filter(Boolean), note:''};
}
function liveItems(t, rs){
  const prev = new Map(((rs && rs.items) || []).map(i => [i.id, i]));
  const items = [];
  t.items.forEach(cid => {
    const c = catById(cid); if (!c) return;

/* Updates today's progress and ticks in place, so typing in a field never rebuilds the page under the finger. */

  const bar = D.querySelector('#daypanel .bar'); if (bar) bar.setAttribute('aria-valuenow', String(c.d));

  if (isIOS() && !isStandalone()) sec.append(h('p', {class:'warn', text:'האפליקציה פתוחה עכשיו בספארי. באייפון, נתונים שנשמרים בספארי לא מופיעים באפליקציה שבמסך הבית. כדי להעביר אותם, שומרים כאן גיבוי לקובץ ומשחזרים אותו באפליקציה שבמסך הבית.'}));
  sec.append(h('div', {class:'factions'},
    h('button', {class:'btn primary', type:'button', id:'bk-file', onclick:saveBackupFile}, 'שמירת גיבוי לקובץ'),
    h('button', {class:'btn', type:'button', id:'bk-copy', onclick:copyBackup}, 'העתקת גיבוי'),
    h('button', {class:'btn', type:'button', id:'bk-restore', 'aria-expanded':S.restoreOpen ? 'true' : 'false', onclick:toggleRestore}, 'שחזור מגיבוי')));
  if (S.backupText) {
    const ta = h('textarea', {id:'bk-text', rows:'4', readonly:true, 'aria-label':'טקסט הגיבוי'}); ta.value = S.backupText;
    sec.append(h('p', {class:'hint', text:'ההעתקה האוטומטית לא עבדה כאן. מסמנים את הטקסט ומעתיקים ידנית.'}), ta);
  }
  if (S.restoreOpen) sec.append(restorePanel());
  return sec;
}
function toggleRestore(){
  S.restoreOpen = !S.restoreOpen; S.restorePending = null; S.restoreError = null;
  render();
}
function restorePanel(){
  const wrap = h('div', {class:'rpanel'});
  wrap.append(
    h('input', {type:'file', id:'rs-file', hidden:true, onchange:onRestoreFile}),
    h('div', {class:'factions'}, h('button', {class:'btn primary', type:'button', id:'rs-pick', onclick:() => { const f = D.getElementById('rs-file'); if (f) f.click(); }}, 'בחירת קובץ גיבוי')));
  const ta = h('textarea', {id:'rs-text', rows:'3', placeholder:'או מדביקים כאן את טקסט הגיבוי', oninput:e => { S.restoreText = e.target.value; }});
  ta.value = S.restoreText;
  wrap.append(h('label', {class:'nlabel', for:'rs-text', text:'הדבקת טקסט גיבוי'}), ta);
  if (S.restoreError) wrap.append(h('p', {class:'err', role:'alert', text:S.restoreError}));
  if (S.restorePending) {
    const p = S.restorePending;
    const sn = p.plan.catalog.filter(c => c.kind !== 'cardio').length, cn = p.plan.catalog.length - sn;
    const tn = p.plan.types.length, wn = p.workouts.length;
    const tTxt = tn === 1 ? 'סוג אימון אחד' : tn + ' סוגי אימונים';
    const wTxt = wn === 0 ? 'בלי אימונים שמורים' : wn === 1 ? 'אימון שמור אחד' : wn + ' אימונים שמורים';
    const text = S.app
      ? (wn ? 'השחזור יחליף את המכשירים, סוגי האימונים והלוח הקבוע, ויוסיף ' + wTxt + ' מהגיבוי לפי תאריך. אימונים שלא מופיעים בגיבוי יישארו.'
            : 'השחזור יחליף את המכשירים, סוגי האימונים והלוח הקבוע. אימונים שכבר שמורים במכשיר יישארו.')
      : 'בגיבוי ' + [itemsSummary(sn, cn) || 'אין תרגילים', tTxt, wTxt].join(', ') + '. לטעון אותו?';
    wrap.append(confirmBox(text, 'שחזור', doRestore));
  } else wrap.append(h('div', {class:'factions'}, h('button', {class:'btn', type:'button', id:'rs-go', onclick:checkRestore}, 'שחזור מהטקסט')));
  return wrap;
}
function onRestoreFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 25e6) { S.restoreError = 'הקובץ גדול מדי בשביל גיבוי של האפליקציה.'; render(); return; }
  const r = new FileReader();
  r.onload = () => { S.restoreText = String(r.result || ''); checkRestore(); };
  r.onerror = () => { S.restoreError = 'הקובץ לא נקרא. אפשר לבחור אותו שוב, או להדביק את טקסט הגיבוי.'; render(); };
  r.readAsText(f);
}
function checkRestore(){
  let o = null;
  try { o = JSON.parse(S.restoreText); } catch (e) {}
  const raw = o && (o.plan || (Array.isArray(o.catalog) && Array.isArray(o.types) ? o : null));
  const plan = raw && Array.isArray(raw.catalog) && Array.isArray(raw.types) ? normApp(raw) : null;
  if (!plan) { S.restoreError = 'זה לא גיבוי של האפליקציה. בוחרים קובץ שנשמר מהאפליקציה, או מדביקים את הטקסט שלו.'; S.restorePending = null; render(); return; }
  const workouts = o.plan && Array.isArray(o.workouts) ? o.workouts.map(normRec).filter(Boolean) : [];
  S.restoreError = null; S.restorePending = {plan, workouts}; render(); focusSoon('cf-no');
}
function doRestore(){
  const p = S.restorePending; if (!p) return;
  const fresh = !S.app;
  p.plan.updatedAt = nowISO(); commitApp(p.plan);
  p.workouts.forEach(w => commitRecord(w));
  S.meta.lastBackupAt = nowISO(); saveMeta();
  S.restoreOpen = false; S.restoreText = ''; S.restorePending = null; S.restoreError = null; S.confirm = null;
  if (fresh) { S.tab = scheduleEmpty() ? 'schedule' : 'week'; S.sel = todayKey(); }
  render(); window.scrollTo(0, 0);
  toast(fresh && scheduleEmpty() ? 'הגיבוי נטען. עכשיו בוחרים באילו ימים מתאמנים' : 'השחזור הושלם');
}
function backupText(){
  const ws = Object.keys(S.workouts).sort().map(k => S.workouts[k]);
  return JSON.stringify({app:'my-fitness-app', format:2, exportedAt:nowISO(), plan:S.app, workouts:ws}, null, 1);
}
function markBackedUp(){ S.meta.lastBackupAt = nowISO(); saveMeta(); render(); }
async function saveBackupFile(){
  const text = backupText(), name = 'my-fitness-app-backup-' + todayKey() + '.json';
  if (isMobileOS() && navigator.share && navigator.canShare) {
    let file = null;
    for (const type of ['application/json', 'text/plain']) {
      try { const f = new File([text], name, {type}); if (navigator.canShare({files:[f]})) { file = f; break; } } catch (e) {}
    }
    if (file) {
      try { await navigator.share({files:[file]}); markBackedUp(); toast('הגיבוי נשמר'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = h('a', {href:url, download:name, hidden:true});
    D.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    markBackedUp(); toast('קובץ הגיבוי ' + name + ' הורד');
  } catch (e) { copyBackup(); }
}
async function copyBackup(){
  const text = backupText();
  try { await navigator.clipboard.writeText(text); S.backupText = ''; markBackedUp(); toast('הגיבוי הועתק. כדאי להדביק אותו בפתק או במייל לעצמך.'); }
  catch (e) { S.backupText = text; render(); const ta = D.getElementById('bk-text'); if (ta) { ta.focus(); ta.select(); } }
}

/* ---------- offline support + updates ---------- */
let waitingSW = null, wantReload = false;
function applyUpdate(){
  if (!waitingSW) { location.reload(); return; }
  wantReload = true;
  try { waitingSW.postMessage('skip-waiting'); } catch (e) { location.reload(); }
}
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!secure) return;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload) { wantReload = false; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { if (!w || !navigator.serviceWorker.controller) return; waitingSW = w; if (!S.updateReady) { S.updateReady = true; render(); } };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); });
    });
    D.addEventListener('visibilitychange', () => { if (D.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

/* ---------- wiring ---------- */
D.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  const t = b.dataset.tab;
  if (t === 'week' && S.tab === 'week' && S.sel !== todayKey()) { selectDay(todayKey()); return; }
  setTab(t);
});
(function swipe(){
  const view = D.getElementById('view'); let s = null;
  view.addEventListener('touchstart', e => {
    s = null;
    if (S.tab !== 'week' || !S.app || e.touches.length !== 1) return;
    const t = e.target;
    if (!t.closest || t.closest('input,textarea,select,.days7')) return;
    const zone = t.closest('#daypanel') ? 1 : (t.closest('.wk') ? 7 : 0);
    if (!zone) return;
    s = {x:e.touches[0].clientX, y:e.touches[0].clientY, at:Date.now(), zone};
  }, {passive:true});
  view.addEventListener('touchend', e => {
    if (!s) return;
    const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y, zone = s.zone, dt = Date.now() - s.at;
    s = null;
    if (dt > 800 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    selectDay(addDays(S.sel, dx > 0 ? zone : -zone));
  }, {passive:true});
})();
function checkDay(){
  const t = todayKey();
  if (t !== S.lastToday) { if (S.sel === S.lastToday) S.sel = t; S.lastToday = t; render(); }
}
D.addEventListener('visibilitychange', () => { if (D.visibilityState === 'visible') checkDay(); });
window.addEventListener('focus', checkDay);
window.addEventListener('storage', e => { if (!e.key || e.key.indexOf(P) === 0) { loadAll(); render(); } });
setInterval(checkDay, 60000);

loadAll();
render();
registerSW();
})();
</script>
